<html>
  <head>
    <title>Primeira atividade de RV usando AR.js e o A-Frame. Marcador Hiro e modelos 3D do A-Frame</title>
      <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
      <!-- we import arjs version without NFT but with marker + location based support -->
      <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden">
    <a-scene vr-mode-ui="enabled: false" embedded ar.js="debugUiEnabled: false">
      <a-marker preset="hiro">
        <a-sphere position="1 0.5 0" color="yellow"></a-sphere>
        <a-box> position="-1 0.5 0" color="green"></a-box>
        <a-cylinder position="0 2 0" color="crimson" height="5" radius="0.2"></a-cylinder>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
