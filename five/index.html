<html>
  <head>
    <title>Segunda atividade de RV usando AR.js e o A-Frame. Marcador Hiro e uma imagem</title>
      <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
      <!-- we import arjs version without NFT but with marker + location based support -->
      <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden">
    <video id="video" src="video.mp4" autoplay loop crossorigin="anonymous" playsinline webkit-playsinline muted style="display: none;"></video>
    <a-scene vr-mode-ui="enabled: false" embedded ar.js="debugUiEnabled: false">
      <a-marker preset="hiro">
        <a-video src="#video" width="1.7" height="1" rotation="-90 0 0"></video>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
