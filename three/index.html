<html>
  <head>
    <title>Terceira atividade de RV usando AR.js e o A-Frame. Marcador Hiro e um modelo 3d</title>
      <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
      <!-- we import arjs version without NFT but with marker + location based support -->
      <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden">
    <a-scene vr-mode-ui="enabled: false" embedded ar.js="debugUiEnabled: false">
        <a-assets>
            <a-asset-item id="modelo" src="star.gltf"></a-asset-item>
        </a-assets>
      <a-marker preset="hiro">
        <a-entity id="modelo3d"
            position="0 0 0"
            rotation="90 0 0"
            scale="1 1 1"
            gltf-model="#modelo"></a-entity>

      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
